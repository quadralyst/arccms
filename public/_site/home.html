<!doctype html>
<!--
  Arc CMS's home page until a site has its own: a placeholder that tells visitors
  the site is not ready, says it runs on Arc CMS, and keeps search engines away
  (noindex). Replace it with src/custom/site/home.html, a whole HTML document
  (docs/website/home-page.html).
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-arc-t="placeholder_title">Coming soon</title>
    <meta name="description" content="This site is being set up with Arc CMS.">
    <meta name="robots" content="noindex">
    <style>
        .arc-placeholder {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3rem 1.5rem;
        }
        .arc-placeholder h1 {
            font-size: clamp(1.75rem, 1rem + 3vw, 2.75rem);
            font-weight: 700;
            margin-bottom: 0.75rem;
        }
        .arc-placeholder-body {
            color: #6e6e73;
            font-size: 1.1rem;
            margin: 0;
        }
        .arc-placeholder-brand {
            margin: 3.5rem auto 0;
            padding-top: 2rem;
            border-top: 1px solid #e8e8ed;
            max-width: 32rem;
        }
        .arc-placeholder-brand img {
            height: 32px;
            width: auto;
            margin-bottom: 0.75rem;
        }
        .arc-placeholder-brand p {
            color: #6e6e73;
            font-size: 0.95rem;
            margin: 0 0 1.25rem;
        }
        .arc-placeholder-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }
        .arc-placeholder-links a {
            display: inline-flex;
            align-items: center;
            padding: 0.55rem 1.1rem;
            border-radius: 999px;
            border: 1px solid #d2d2d7;
            color: #1d1d1f;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }
        .arc-placeholder-links a:hover {
            border-color: #0066cc;
            color: #0066cc;
        }
        .arc-placeholder-links a.primary {
            background: #1d1d1f;
            border-color: #1d1d1f;
            color: #fff;
        }
        .arc-placeholder-links a.primary:hover {
            background: #0066cc;
            border-color: #0066cc;
        }
    </style>
</head>
<body>
    <main class="arc-placeholder">
        <div>
            <h1 data-arc-t="placeholder_heading">This site is not set up yet</h1>
            <p class="arc-placeholder-body" data-arc-t="placeholder_body">Please check back soon.</p>

            <div class="arc-placeholder-brand">
                <a href="https://arccms.com" target="_blank" rel="noopener"><img src="/assets/images/logo.png" width="190" height="60" alt="Arc CMS"></a>
                <p data-arc-t="placeholder_brand">This site runs on Arc CMS, the open source CMS for landing pages, blogs and waitlists on your own Firebase project.</p>
                <div class="arc-placeholder-links">
                    <a class="primary" href="https://arccms.com" target="_blank" rel="noopener" data-arc-t="placeholder_link_site">Visit arccms.com</a>
                    <a href="https://github.com/quadralyst/arccms" target="_blank" rel="noopener" data-arc-t="placeholder_link_github">Arc CMS on GitHub</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
