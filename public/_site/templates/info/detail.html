<!--
  The standard pages' detail template (specs/site-sections-spec.md, SS6): About,
  Contact, FAQ and the policies at /info/{page}.

  The body, then four sections, each shown only when the page has it:
    the map       its Locations field (info-locations) has a place
    the questions its FAQ field (info-faq) has a row
    your details  "Show contact details" is on, and Settings, About has an email, phone,
                  address or social link: printed with data-arc-site
    the form      "Show contact form" is on, and the contact form feature with it

  Replace it with src/custom/site/templates/info/detail.html, or restyle the
  .arc-page classes in your site.css.
-->
<div class="arc-cms-template">
    <arc-header></arc-header>

    <article class="arc-page">
        <div class="container">
            <h1 class="arc-page-title">{{ title }}</h1>
            <div class="arc-page-body" [innerHTML]="content"></div>

            <section class="arc-page-section arc-page-locations" data-arc-if="locations">
                <h2 class="arc-page-heading" data-arc-if="locations_heading" data-arc-bind="locations_heading">Find us</h2>
                <div class="arc-page-locations-grid" data-arc-loop="locations">
                    <div class="arc-page-location">
                        <iframe data-arc-if="map_embed" data-arc-bind="map_embed" loading="lazy" title="Map"></iframe>
                        <h3 data-arc-bind="label">Location name</h3>
                        <p data-arc-bind="address">Street, City</p>
                        <a data-arc-if="map_directions" data-arc-bind="map_directions" target="_blank" rel="noopener"
                            data-arc-t="get_directions">Get directions</a>
                    </div>
                </div>
            </section>

            <section class="arc-page-section arc-page-faq" data-arc-if="faq">
                <h2 class="arc-page-heading" data-arc-if="faq_heading" data-arc-bind="faq_heading">Frequently asked questions</h2>
                <div data-arc-loop="faq">
                    <details class="arc-page-question">
                        <summary data-arc-bind="question">Question</summary>
                        <div class="arc-page-answer" data-arc-bind="answer_html">Answer</div>
                    </details>
                </div>
            </section>

            <section class="arc-page-section arc-page-details" data-arc-if="show-contact-details" data-arc-site-if="contact">
                <h2 class="arc-page-heading" data-arc-t="contact_details">How to reach us</h2>
                <dl class="arc-page-details-list">
                    <div data-arc-site-if="email"><dt data-arc-t="contact_email">Email</dt><dd><a data-arc-site="email"></a></dd></div>
                    <div data-arc-site-if="phone"><dt data-arc-t="contact_phone">Phone</dt><dd><a data-arc-site="phone"></a></dd></div>
                    <div data-arc-site-if="address"><dt data-arc-t="contact_address">Address</dt><dd data-arc-site="address"></dd></div>
                </dl>
                <ul class="arc-page-social" data-arc-site-loop="social">
                    <li><a href="{{ url }}" target="_blank" rel="noopener"><i class="{{ icon }}" aria-hidden="true"></i> {{ label }}</a></li>
                </ul>
            </section>

            <section class="arc-page-section arc-page-form" data-arc-if="show-contact-form">
                <h2 class="arc-page-heading" data-arc-t="contact_write">Write to us</h2>
                <form data-arc-contact-form class="arc-page-contact-form">
                    <label><span data-arc-t="contact_name">Your name</span><input name="name" autocomplete="name"></label>
                    <label><span data-arc-t="contact_email">Email</span><input name="email" type="email" required autocomplete="email"></label>
                    <label><span data-arc-t="contact_message">Message</span><textarea name="message" rows="5" required></textarea></label>
                    <button type="submit" data-arc-t="contact_send">Send</button>
                </form>
            </section>
        </div>
    </article>

    <arc-footer></arc-footer>
</div>

<style>
.arc-page { padding: 3rem 0 4rem; }
.arc-page .container { max-width: 760px; }
.arc-page-title { font-size: 2.25rem; font-weight: 700; margin: 0 0 1.5rem; }
.arc-page-body { line-height: 1.7; }
.arc-page-body h2 { font-size: 1.35rem; margin: 2rem 0 0.75rem; }
.arc-page-section { margin-top: 3rem; }
.arc-page-heading { font-size: 1.25rem; font-weight: 600; margin: 0 0 1rem; }
.arc-page-locations-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
.arc-page-location { border: 1px solid #e8e8ed; border-radius: 12px; overflow: hidden; }
.arc-page-location iframe { display: block; width: 100%; height: 200px; border: 0; }
.arc-page-location h3 { font-size: 1rem; margin: 0.75rem 1rem 0.25rem; }
.arc-page-location p, .arc-page-location a { display: block; margin: 0 1rem 0.75rem; }
.arc-page-question { border-bottom: 1px solid #e8e8ed; padding: 0.875rem 0; }
.arc-page-question summary { cursor: pointer; font-weight: 600; }
.arc-page-answer { margin-top: 0.5rem; }
.arc-page-answer p { margin: 0 0 0.5rem; }
.arc-page-details-list { display: grid; grid-template-columns: max-content 1fr; gap: 0.5rem 1.5rem; margin: 0; }
.arc-page-details-list > div { display: contents; }
.arc-page-details-list dt { font-weight: 600; }
.arc-page-details-list dd { margin: 0; }
.arc-page-social { display: flex; flex-wrap: wrap; gap: 1rem; list-style: none; padding: 0; margin: 1rem 0 0; }
.arc-page-contact-form { display: flex; flex-direction: column; gap: 0.75rem; max-width: 520px; }
.arc-page-contact-form label { display: flex; flex-direction: column; gap: 0.25rem; font-weight: 500; }
.arc-page-contact-form input, .arc-page-contact-form textarea { padding: 0.6rem 0.75rem; border: 1px solid #d2d2d7; border-radius: 8px; font: inherit; font-weight: 400; }
.arc-page-contact-form button { align-self: flex-start; padding: 0.6rem 1.5rem; border: 0; border-radius: 8px; background: #0066cc; color: #fff; font-weight: 600; cursor: pointer; }
</style>
