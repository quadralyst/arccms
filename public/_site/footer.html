<!--
  Arc CMS's default site footer (specs/site-sections-spec.md, SS6): a link to
  each published standard page (About, Contact, the policies), in the order set
  with Arrange under Content, Pages, then the site's name from Settings, About.
  A page appears here once it is published. Replace it with
  src/custom/site/footer.html.
-->
<footer class="site-footer">
    <div class="container">
        <ul class="footer-pages" data-arc-site-if="pages" data-arc-site-loop="pages">
            <li><a href="{{ url }}">{{ title }}</a></li>
        </ul>
        <p class="footer-copyright">&copy; <span data-arc-site="year"></span> <span data-arc-site="name"></span></p>
    </div>
</footer>
