<header class="site-header">
    <div class="site-header__inner">

        <a class="site-header__brand" href="/">
            <span class="site-header__logo"><img src="/public/assets/images/main_logo.png" alt="GoWow Logo" /></span>
            <!-- <span class="site-header__tagline">Infrastructure for Goodness</span> -->
        </a>

        <nav class="site-header__nav" [class.site-header__nav--open]="isMenuOpen()" aria-label="Primary">
            <ul class="site-header__menu">
                <li class="site-header__item"><a class="site-header__link" href="#why">Why GoWow</a></li>
                <li class="site-header__item"><a class="site-header__link site-header__link--has-menu"
                        href="#for-you">For You <i class="fa-solid fa-chevron-down"></i></a></li>
                <li class="site-header__item"><a class="site-header__link site-header__link--has-menu"
                        href="#impact">Impact <i class="fa-solid fa-chevron-down"></i></a></li>
                <li class="site-header__item"><a class="site-header__link site-header__link--has-menu"
                        href="#programs">Programs <i class="fa-solid fa-chevron-down"></i></a></li>
                <li class="site-header__item"><a class="site-header__link" href="#academia">Academia</a></li>
                <li class="site-header__item"><a class="site-header__link site-header__link--has-menu"
                        href="#about">About Us <i class="fa-solid fa-chevron-down"></i></a></li>
            </ul>
        </nav>

        <div class="site-header__actions">
            <a class="btn btn--primary btn--pill"
                href="https://play.google.com/store/apps/details?id=com.quadralyst.GoWow&pcampaignid=web_share"
                target="_blank">Download App</a>
            <a class="btn btn--outline btn--pill" href="#partner">Partner With Us</a>
        </div>

        <button class="site-header__toggle" type="button" aria-expanded="false" aria-controls="site-menu"
            (click)="toggleMenu()">
            <span class="site-header__toggle-bar"></span>
            <span class="visually-hidden">Menu</span>
        </button>

    </div>
</header>
