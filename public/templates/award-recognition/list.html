<div class="arc-cms-template">
    <arc-header></arc-header>

    <!-- recognition Hero Section - Compact Apple-inspired design -->
    <section class="recognition-hero">
        <div class="container">
            <h1 class="recognition-title arc-skeleton">{{ contentType }}</h1>
            <p class="recognition-subtitle arc-skeleton">{{ contentTypeDescription }}</p>
        </div>
    </section>

    <!-- recognition Grid Section -->
    <section class="recognition-section">
        <div class="container">
            <div class="recognition-grid" data-arc-loop="items" data-limit="12">
                <!-- recognition Card Template -->
                <a class="recognition-card" href="{{ url }}">
                    <div class="recognition-image-wrapper">
                        <img class="recognition-image" src="{{ coverImage }}" alt="{{ title }}">
                    </div>
                    <div class="recognition-content">
                        <div class="recognition-meta">
                            <time datetime="{{ publishedOn }}" class="arc-skeleton">{{ publishedOn }}</time>
                            <span class="meta-separator">•</span>
                            <span class="arc-skeleton">{{ readTime }}</span> min read
                            <span class="meta-separator category-separator">•</span>
                            <span class="category-badge arc-skeleton">{{ cat }}</span>
                        </div>
                        <h2 class="recognition-title arc-skeleton">{{ title }}</h2>
                        <p class="recognition-excerpt arc-skeleton">{{ excerpt }}</p>
                        <span class="recognition-read-more">Read recognition <i class="fas fa-arrow-right"></i></span>
                    </div>
                </a>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <i class="fas fa-newspaper"></i>
                <h3>No recognition Yet</h3>
                <p>Check back soon for new content.</p>
            </div>
        </div>
    </section>

    <arc-footer></arc-footer>
</div>

<style>
    /* Apple-inspired recognition List Styles - Compact */
    .recognition-hero {
        padding: 3rem 0 2rem;
        text-align: center;
        background: linear-gradient(180deg, #f5f5f7 0%, #ffffff 100%);
    }

    .recognition-title {
        font-size: 2.5rem;
        font-weight: 700;
        color: #1d1d1f;
        margin-bottom: 0.5rem;
        letter-spacing: -0.02em;
    }

    .recognition-subtitle {
        font-size: 1rem;
        color: #6e6e73;
        max-width: 600px;
        margin: 0 auto;
        line-height: 1.4;
    }

    .recognition-section {
        padding: 2rem 0 4rem;
        background: #ffffff;
    }

    .recognition-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 2rem;
    }

    .recognition-card {
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border-radius: 20px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
        height: 100%;
    }

    .recognition-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
    }

    .recognition-card:hover .recognition-read-more {
        color: #0066cc;
    }

    .recognition-card:hover .recognition-read-more i {
        transform: translateX(4px);
    }

    .recognition-image-wrapper {
        position: relative;
        width: 100%;
        height: 200px;
        overflow: hidden;
        background: #f5f5f7;
    }

    .recognition-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }

    .recognition-card:hover .recognition-image {
        transform: scale(1.05);
    }


    .recognition-content {
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .recognition-meta {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        color: #6e6e73;
        margin-bottom: 0.75rem;
    }

    .meta-separator {
        color: #d2d2d7;
    }

    .category-badge {
        display: inline-block;
        padding: 0.15rem 0.5rem;
        background: linear-gradient(135deg, #e8e8ed 0%, #d2d2d7 100%);
        border-radius: 100px;
        font-size: 0.75rem;
        font-weight: 500;
        color: #6e6e73;
    }

    .category-badge:empty,
    .category-separator:has(+ .category-badge:empty) {
        display: none;
    }

    .recognition-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: #1d1d1f;
        line-height: 1.3;
        margin-bottom: 0.75rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .recognition-excerpt {
        font-size: 0.95rem;
        color: #6e6e73;
        line-height: 1.6;
        margin-bottom: 1.25rem;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        flex: 1;
    }

    .recognition-read-more {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.9rem;
        font-weight: 500;
        color: #1d1d1f;
        transition: color 0.2s ease;
        margin-top: auto;
    }

    .recognition-read-more i {
        font-size: 0.75rem;
        transition: transform 0.2s ease;
    }

    /* Tags in cards */
    .recognition-tags-inline {
        margin-bottom: 0.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
    }

    .recognition-tags-inline:empty {
        display: none;
    }

    .tag-pill {
        font-size: 0.7rem;
        padding: 0.2rem 0.5rem;
        border-radius: 100px;
        font-weight: 500;
    }

    /* Empty State */
    .empty-state {
        display: none;
        text-align: center;
        padding: 6rem 2rem;
    }

    .empty-state i {
        font-size: 4rem;
        color: #d2d2d7;
        margin-bottom: 1.5rem;
    }

    .empty-state h3 {
        font-size: 1.5rem;
        color: #1d1d1f;
        margin-bottom: 0.5rem;
    }

    .empty-state p {
        color: #6e6e73;
        font-size: 1rem;
    }

    /* Show empty state when grid is empty */
    .recognition-grid:empty+.empty-state {
        display: block;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .recognition-hero {
            padding: 4rem 0 3rem;
        }

        .recognition-title {
            font-size: 2.5rem;
        }

        .recognition-grid {
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
    }
</style>

<script>
    // Generic image error handler - show neutral gradient when image fails to load
    (function () {
        function handleImageError(img) {
            img.style.display = 'none';
            img.parentElement.style.background = 'linear-gradient(135deg, #e8e8ed 0%, #d2d2d7 100%)';
        }

        function processImages() {
            document.querySelectorAll('.recognition-image').forEach(function (img) {
                // Check if image is broken or has no valid src
                if (!img.src || img.src === window.location.href || img.src === '' ||
                    (img.complete && img.naturalHeight === 0)) {
                    handleImageError(img);
                }

                // Add error handler for future load failures
                img.onerror = function () {
                    handleImageError(this);
                };
            });
        }

        // Run on DOMContentLoaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', processImages);
        } else {
            processImages();
        }

        // Also run after a delay for Angular hydration
        setTimeout(processImages, 500);
        setTimeout(processImages, 1500);

        // Watch for dynamically added content
        var observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
                if (mutation.addedNodes.length) {
                    processImages();
                }
            });
        });

        observer.observe(document.body || document.documentElement, {
            childList: true,
            subtree: true
        });
    })();
</script>
