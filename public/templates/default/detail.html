<!--
  Default detail template.

  This is the layout used when a content type has no template folder of its
  own (templateFolder empty or "default"). It mirrors the Angular
  ContentDetailComponent's built-in layout so a page looks the same whether it
  is rendered locally by the SPA or deployed as static HTML by the publish
  pipeline — previously the server fell back to a bare unstyled skeleton while
  the SPA rendered this design.

  Bindings come from buildTemplateData() in functions/src/pages/deployContentPage.ts.
-->
<div class="arc-cms-template">
    <arc-header></arc-header>

    <article class="article-detail">
        <header class="article-header">
            <div class="container">
                <a class="article-back-link" href="{{ langPrefix }}/{{ contentTypeSlug }}">
                    <i class="fas fa-arrow-left"></i> <span data-arc-t="back_to">Back to {{ contentType }}</span>
                </a>
                <h1 class="article-title">{{ title }}</h1>
                <div class="article-meta">
                    <span class="article-date">
                        <i class="far fa-calendar"></i> {{ date }}
                    </span>
                    <span class="meta-divider">&#8226;</span>
                    <span class="article-read-time">
                        <i class="far fa-clock"></i> <span data-arc-t="reading_time">{{ readingTime }}</span>
                    </span>
                </div>
            </div>
        </header>

        <div class="article-cover" data-arc-if="coverImage">
            <img src="{{ coverImage }}" alt="{{ title }}" class="article-cover-image">
        </div>

        <div class="article-body">
            <div class="container">
                <div class="article-content" [innerHTML]="content"></div>

                <!--
                  Repeating custom fields.

                  These use the *unprefixed* field key. Custom fields are stored
                  as `<slug>_<key>`, which a shared template cannot name — so
                  the publish pipeline also publishes each repeating field under
                  its bare key. A content type with an Info Card field keyed
                  `info_cards` fills the first block; one with a Gallery keyed
                  `gallery` fills the second; one with a Label + Value field
                  keyed `details` fills the facts list; one with a Map Location
                  field keyed `locations` fills the map cards. A type with
                  none of them gets nothing: an empty loop clears its
                  container, so the placeholder rows below never reach a
                  published page.

                  Rename the loop to match your own key, or copy this folder and
                  lay them out however you like.
                -->
                <div class="arc-info-cards" data-arc-loop="info_cards">
                    <div class="arc-info-card">
                        <span class="arc-info-card-visual">
                            <img data-arc-if="image" data-arc-bind="image" alt="">
                            <i data-arc-if="icon" class="{{ icon }}" aria-hidden="true"></i>
                        </span>
                        <h3 class="arc-info-card-headline" data-arc-bind="headline">Headline</h3>
                        <p class="arc-info-card-info" data-arc-bind="info">Info</p>
                    </div>
                </div>

                <div class="arc-gallery" data-arc-loop="gallery">
                    <figure class="arc-gallery-item">
                        <img data-arc-if="image" data-arc-bind="image" alt="">
                        <button data-arc-if="video_thumb" type="button"
                                class="arc-gallery-video" data-embed="{{ video_embed }}">
                            <img data-arc-bind="video_thumb" alt="">
                            <span class="arc-gallery-play" aria-hidden="true">&#9654;</span>
                        </button>
                        <figcaption data-arc-bind="caption">Caption</figcaption>
                    </figure>
                </div>

                <section class="arc-glance" data-arc-if="details">
                    <h3 class="arc-glance-heading" data-arc-if="details_heading"
                        data-arc-bind="details_heading">At a glance</h3>
                    <dl class="arc-glance-list" data-arc-loop="details">
                        <div class="arc-glance-row">
                            <dt data-arc-bind="label">Label</dt>
                            <dd data-arc-bind="value">Value</dd>
                        </div>
                    </dl>
                </section>

                <section class="arc-locations" data-arc-if="locations">
                    <h3 class="arc-locations-heading" data-arc-if="locations_heading"
                        data-arc-bind="locations_heading">Find us</h3>
                    <div class="arc-locations-grid" data-arc-loop="locations">
                        <article class="arc-location">
                            <!-- A keyless OpenStreetMap frame: no API key, no map
                                 library, and no tracking cookies on the visitor. -->
                            <iframe data-arc-if="map_embed" data-arc-bind="map_embed"
                                    loading="lazy" title="Map"></iframe>
                            <h4 data-arc-bind="label">Location name</h4>
                            <p data-arc-bind="address">Street, City</p>
                            <a data-arc-if="map_directions" data-arc-bind="map_directions"
                               target="_blank" rel="noopener">Get directions</a>
                        </article>
                    </div>
                </section>

                <div class="article-tags" data-arc-loop="tags">
                    <span class="article-tag">{{ name }}</span>
                </div>

                <div class="article-share">
                    <span class="share-label" data-arc-t="share_this_article">Share this article</span>
                    <div class="share-buttons">
                        <a class="share-btn share-twitter" href="{{ share.twitter }}" target="_blank" rel="noopener">
                            <i class="fab fa-twitter"></i>
                        </a>
                        <a class="share-btn share-facebook" href="{{ share.facebook }}" target="_blank" rel="noopener">
                            <i class="fab fa-facebook-f"></i>
                        </a>
                        <a class="share-btn share-linkedin" href="{{ share.linkedin }}" target="_blank" rel="noopener">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                        <a class="share-btn share-email" href="{{ share.email }}">
                            <i class="fas fa-envelope"></i>
                        </a>
                    </div>
                </div>

                <nav class="article-navigation">
                    <a href="{{ langPrefix }}/{{ contentTypeSlug }}" class="nav-back">
                        <i class="fas fa-th-large"></i>
                        <span data-arc-t="all_of_type">All {{ contentType }}</span>
                    </a>
                </nav>
            </div>
        </div>
    </article>

    <arc-footer></arc-footer>
</div>

<style>
.article-detail {
    min-height: 60vh;
    background: #ffffff;
}

/* Article Header */
.article-header {
    padding: 3rem 0 2rem;
    text-align: center;
    background: linear-gradient(180deg, #f5f5f7 0%, #ffffff 100%);
}

.article-back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    color: #0066cc;
    text-decoration: none;
    margin-bottom: 1.5rem;
    transition: color 0.2s;
}

.article-back-link:hover {
    color: #004499;
}

.article-title {
    font-size: 2.5rem;
    font-weight: 700;
    color: #1d1d1f;
    line-height: 1.2;
    margin-bottom: 1.5rem;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
    letter-spacing: -0.02em;
}

.article-meta {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.95rem;
    color: #6e6e73;
}

.article-meta i {
    margin-right: 0.35rem;
}

.meta-divider {
    color: #d2d2d7;
}

/* Cover Image */
.article-cover {
    max-width: 1000px;
    margin: 0 auto 2rem;
    padding: 0 1rem;
}

.article-cover-image {
    width: 100%;
    height: auto;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

/* Article Body */
.article-body {
    padding: 2rem 0 4rem;
}

.article-content {
    max-width: 720px;
    margin: 0 auto;
    font-size: 1.125rem;
    line-height: 1.8;
    color: #1d1d1f;
}

.article-content h2 {
    font-size: 1.75rem;
    font-weight: 700;
    margin-top: 3rem;
    margin-bottom: 1rem;
    color: #1d1d1f;
    letter-spacing: -0.01em;
}

.article-content h3 {
    font-size: 1.375rem;
    font-weight: 600;
    margin-top: 2.5rem;
    margin-bottom: 0.75rem;
    color: #1d1d1f;
}

.article-content p {
    margin-bottom: 1.5rem;
}

.article-content img {
    max-width: 100%;
    height: auto;
    border-radius: 12px;
    margin: 2rem 0;
}

.article-content blockquote {
    border-left: 3px solid #0066cc;
    padding-left: 1.5rem;
    margin: 2rem 0;
    font-style: italic;
    color: #6e6e73;
    font-size: 1.1rem;
}

.article-content code {
    background: #f5f5f7;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: 'SF Mono', Menlo, monospace;
}

.article-content pre {
    background: #1d1d1f;
    color: #f5f5f7;
    padding: 1.5rem;
    border-radius: 12px;
    overflow-x: auto;
    margin: 2rem 0;
    font-size: 0.9rem;
}

.article-content pre code {
    background: none;
    padding: 0;
    color: inherit;
}

.article-content ul,
.article-content ol {
    margin-bottom: 1.5rem;
    padding-left: 1.5rem;
}

.article-content li {
    margin-bottom: 0.5rem;
}

/* Tags */
.article-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid #e8e8ed;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
}

/* An item with no tags leaves this container empty; without :empty its
   border-top and padding publish as a stray horizontal rule. Same guard the
   repeating-field containers above use. */
.article-tags:empty {
    display: none;
}

.article-tag {
    background: #f5f5f7;
    color: #1d1d1f;
    padding: 0.5rem 1rem;
    border-radius: 100px;
    font-size: 0.875rem;
    font-weight: 500;
    transition: background 0.2s;
}

.article-tag:hover {
    background: #e8e8ed;
}

/* Share Buttons */
.article-share {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid #e8e8ed;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
}

.share-label {
    font-size: 0.9rem;
    color: #6e6e73;
    font-weight: 500;
}

.share-buttons {
    display: flex;
    gap: 0.75rem;
}

.share-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    color: #ffffff;
    text-decoration: none;
    transition: transform 0.2s, opacity 0.2s;
}

.share-btn:hover {
    transform: scale(1.1);
    opacity: 0.9;
}

.share-twitter { background: #1DA1F2; }
.share-facebook { background: #4267B2; }
.share-linkedin { background: #0A66C2; }
.share-email { background: #6e6e73; }

/* Navigation */
.article-navigation {
    display: flex;
    justify-content: center;
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid #e8e8ed;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
}

.nav-back {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    background: #f5f5f7;
    color: #1d1d1f;
    border-radius: 100px;
    text-decoration: none;
    font-weight: 500;
    transition: background 0.2s;
}

.nav-back:hover {
    background: #e8e8ed;
}

/* Responsive */
@media (max-width: 768px) {
    .article-header {
        padding: 2rem 0 1.5rem;
    }

    .article-title {
        font-size: 1.75rem;
    }

    .article-meta {
        flex-direction: column;
        gap: 0.5rem;
    }

    .meta-divider {
        display: none;
    }

    .article-content {
        font-size: 1rem;
    }

    .article-share {
        flex-direction: column;
        align-items: flex-start;
    }
}
/* ── Repeating custom fields ─────────────────────────────────────────────── */

/* Both containers are emptied when their field has no rows, so an unused one
   collapses to nothing rather than leaving a gap. */
.arc-info-cards,
.arc-gallery {
    max-width: 720px;
    margin: 3rem auto 0;
}

.arc-info-cards:empty,
.arc-gallery:empty {
    display: none;
    margin: 0;
}

.arc-info-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
}

.arc-info-card {
    padding: 1.25rem;
    border: 1px solid #e8e8ed;
    border-radius: 12px;
    background: #fbfbfd;
}

.arc-info-card-visual i {
    font-size: 1.35rem;
    color: #0066cc;
}

.arc-info-card-visual img {
    width: 2.5rem;
    height: 2.5rem;
    object-fit: cover;
    border-radius: 8px;
}

.arc-info-card-headline {
    font-size: 1rem;
    font-weight: 600;
    color: #1d1d1f;
    margin: 0.75rem 0 0.35rem;
}

.arc-info-card-info {
    font-size: 0.9rem;
    line-height: 1.6;
    color: #6e6e73;
    margin: 0;
}

.arc-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
}

.arc-gallery-item {
    margin: 0;
}

.arc-gallery-item > img,
.arc-gallery-video img,
.arc-gallery-item iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    border: 0;
}

/* The poster is a button until it is clicked, so the page ships no player
   JavaScript for videos nobody watches. */
.arc-gallery-video {
    position: relative;
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
}

.arc-gallery-play {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    font-size: 1.1rem;
    line-height: 3rem;
    text-align: center;
}

.arc-gallery-video:hover .arc-gallery-play {
    background: rgba(0, 0, 0, 0.85);
}

.arc-gallery-item figcaption {
    margin-top: 0.5rem;
    font-size: 0.85rem;
    color: #6e6e73;
}

.arc-gallery-item figcaption:empty {
    display: none;
}
.arc-glance {
    max-width: 720px;
    margin: 3rem auto 0;
    padding: 1.25rem 1.5rem;
    border: 1px solid #e8e8ed;
    border-radius: 12px;
    background: #fbfbfd;
}

.arc-glance-heading {
    font-size: 1rem;
    font-weight: 600;
    color: #1d1d1f;
    margin: 0 0 0.5rem;
}

.arc-glance-list {
    margin: 0;
}

/* A hairline between rows, not around them — the card already has a border. */
.arc-glance-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 0.6rem 0;
    border-top: 1px solid #e8e8ed;
}

.arc-glance-row:first-child {
    border-top: 0;
}

.arc-glance-row dt {
    color: #6e6e73;
    font-size: 0.9rem;
    font-weight: 400;
}

.arc-glance-row dd {
    margin: 0;
    color: #1d1d1f;
    font-size: 0.9rem;
    font-weight: 600;
    text-align: right;
}
.arc-locations {
    max-width: 720px;
    margin: 3rem auto 0;
}

.arc-locations:empty,
.arc-locations-grid:empty {
    display: none;
}

.arc-locations-heading {
    font-size: 1rem;
    font-weight: 600;
    color: #1d1d1f;
    margin: 0 0 0.75rem;
}

.arc-locations-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1rem;
}

.arc-location {
    border: 1px solid #e8e8ed;
    border-radius: 12px;
    overflow: hidden;
    background: #fbfbfd;
}

/* The frame carries no controls of its own beyond OpenStreetMap's — the map is
   a picture of where the place is, not something to explore. */
.arc-location iframe {
    display: block;
    width: 100%;
    height: 180px;
    border: 0;
}

.arc-location h4 {
    font-size: 0.95rem;
    font-weight: 600;
    color: #1d1d1f;
    margin: 0.85rem 1rem 0.25rem;
}

.arc-location h4:empty {
    display: none;
}

.arc-location p {
    font-size: 0.85rem;
    line-height: 1.5;
    color: #6e6e73;
    margin: 0 1rem 0.5rem;
}

.arc-location a {
    display: inline-block;
    margin: 0 1rem 1rem;
    font-size: 0.85rem;
    color: #0066cc;
    text-decoration: none;
}

.arc-location a:hover {
    text-decoration: underline;
}
</style>

<script>
    // Swaps a gallery poster for the real player on click. Ten iframes is
    // roughly ten megabytes of YouTube JavaScript; this loads one, on demand.
    document.querySelectorAll('.arc-gallery-video').forEach(function (button) {
        button.addEventListener('click', function () {
            var frame = document.createElement('iframe');
            frame.src = button.dataset.embed + '?autoplay=1';
            frame.allow = 'accelerated-motion; autoplay; encrypted-media; picture-in-picture';
            frame.allowFullscreen = true;
            frame.title = 'Video';
            button.replaceWith(frame);
        });
    });
</script>
