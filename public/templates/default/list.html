<!--
  Default list template.

  Used when a content type has no template folder of its own. Mirrors the
  Angular ContentListComponent's built-in layout so a list page looks the same
  rendered locally by the SPA and deployed as static HTML.

  Bindings come from generateAndDeployContentListPage() in
  functions/src/pages/deployContentListPage.ts — page-level fields plus an
  `items` loop.
-->
<div class="arc-cms-template">
    <arc-header></arc-header>

    <div class="content-list-page">
        <section class="content-hero">
            <div class="container">
                <h1 class="content-hero-title">{{ contentType }}</h1>
                <p class="content-hero-subtitle">{{ contentTypeDescription }}</p>
            </div>
        </section>

        <section class="content-grid-section">
            <div class="container">
                <div class="content-grid" data-arc-loop="items">
                    <a href="{{ url }}" class="content-card">
                        <div class="content-card-image">
                                <img src="{{ coverImage }}" alt="{{ title }}" class="content-card-img"
                                    data-arc-if="coverImage">
                            </div>
                        <div class="content-card-body">
                            <div class="content-card-meta">
                                <time>{{ publishedOn }}</time>
                                <span class="meta-separator">&#8226;</span>
                                <span data-arc-t="min_read">{{ readTime }} min read</span>
                            </div>
                            <h2 class="content-card-title">{{ title }}</h2>
                            <p class="content-card-excerpt">{{ excerpt }}</p>
                            <span class="content-card-read-more"><span data-arc-t="read_more">Read Article</span> <i class="fas fa-arrow-right"></i></span>
                        </div>
                    </a>
                </div>
            </div>
        </section>
    </div>

    <arc-footer></arc-footer>
</div>

<style>
/* Apple-inspired Content List Styles */

.content-list-page {
    min-height: 60vh;
}

/* Hero Section - Compact */
.content-hero {
    padding: 3rem 0 2rem;
    text-align: center;
    background: linear-gradient(180deg, #f5f5f7 0%, #ffffff 100%);
}

.content-hero-title {
    font-size: 2.5rem;
    font-weight: 700;
    color: #1d1d1f;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
}

.content-hero-subtitle {
    font-size: 1rem;
    color: #6e6e73;
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.4;
}

/* Content Grid Section */
.content-grid-section {
    padding: 2rem 0 4rem;
    background: #ffffff;
}

.content-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 2rem;
}

/* Content Card */
.content-card {
    display: flex;
    flex-direction: column;
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
    height: 100%;
}

.content-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
}

.content-card:hover .content-card-read-more {
    color: #0066cc;
}

.content-card:hover .content-card-read-more i {
    transform: translateX(4px);
}

.content-card-image {
    position: relative;
    width: 100%;
    height: 200px;
    overflow: hidden;
    background-color: #f5f5f7;
}

/* The Angular default paints the cover as a CSS background; the static
   template uses an <img> because the hydrator has no background-image
   binding. Same result, and it degrades to the placeholder colour when the
   item has no cover image. */
.content-card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.content-card-placeholder {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #e8e8ed 0%, #d2d2d7 100%);
}

.content-card-body {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.content-card-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    color: #6e6e73;
    margin-bottom: 0.75rem;
}

.meta-separator {
    color: #d2d2d7;
}

.content-card-title {
    font-size: 1.25rem;
    font-weight: 600;
    color: #1d1d1f;
    line-height: 1.3;
    margin-bottom: 0.75rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.content-card-excerpt {
    font-size: 0.95rem;
    color: #6e6e73;
    line-height: 1.6;
    margin-bottom: 1.25rem;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
}

.content-card-read-more {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    font-weight: 500;
    color: #1d1d1f;
    transition: color 0.2s ease;
    margin-top: auto;
}

.content-card-read-more i {
    font-size: 0.75rem;
    transition: transform 0.2s ease;
}

/* Empty State */
.empty-state {
    display: block;
    text-align: center;
    padding: 6rem 2rem;
}

.empty-state i {
    font-size: 4rem;
    color: #d2d2d7;
    margin-bottom: 1.5rem;
}

.empty-state h3 {
    font-size: 1.5rem;
    color: #1d1d1f;
    margin-bottom: 0.5rem;
}

.empty-state p {
    color: #6e6e73;
    font-size: 1rem;
}

/* Responsive */
@media (max-width: 768px) {
    .content-hero {
        padding: 4rem 0 3rem;
    }

    .content-hero-title {
        font-size: 2rem;
    }

    .content-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
    }
}
</style>
