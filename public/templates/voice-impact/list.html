<div class="arc-cms-template">
    <main class="vo-page">
        <section class="vo-intro">
            <div class="vo-shell">
                <nav class="vo-crumbs" aria-label="Breadcrumb">
                    <ol class="vo-crumbs__list">
                        <li class="vo-crumbs__item"><a class="vo-crumbs__link" href="/"><i class="fa-solid fa-house"
                                    aria-hidden="true"></i> Home</a></li>
                        <li class="vo-crumbs__item vo-crumbs__item--current" aria-current="page"
                            data-arc-bind="contentType">Voices of Impact</li>
                    </ol>
                </nav>

                <h1 class="vo-intro__title" data-arc-bind="contentType"></h1>
                <p class="vo-intro__sub">Hear from our community — volunteers, corporate
                    partners, donors, NGOs and colleges, in their own words.</p>
            </div>
        </section>
        <section class="vo-wall">
            <div class="vo-shell">

                <div class="vo-grid" data-arc-loop="items" data-limit="48">

                    <figure class="vo-card">
                        <div class="vo-card__top">
                            <span class="vo-card__chip" data-arc-if="cat" data-arc-bind="cat"></span>
                            <i class="vo-card__mark fa-solid fa-quote-right" aria-hidden="true"></i>
                        </div>
                        <p class="vo-stars" data-arc-if="voices-of-impact_rating"
                            data-arc-repeat="voices-of-impact_rating">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star-half"></i>
                        </p>
                        <blockquote class="vo-card__quote" data-arc-bind="voices-of-impact_comment">
                        </blockquote>
                        <figcaption class="vo-card__by">
                            <img class="vo-card__avatar" data-arc-if="coverImage" src={{coverImage}} alt="" width="512"
                                height="512">
                            <div class="voices-card-avatar-fallback" data-arc-if="!coverImage">
                                <i class="fas fa-user"></i>
                            </div>
                            <span class="vo-card__who">
                                <span class="vo-card__name" data-arc-bind="voices-of-impact_name"></span>
                                <span class="vo-card__role" data-arc-if="voices_role"
                                    data-arc-bind="voices-of-impact_designation"></span>
                            </span>
                        </figcaption>
                    </figure>
                </div>
            </div>
        </section>
        <section class="vo-cta">
            <div class="vo-shell">
                <div class="vo-cta__panel">
                    <div class="vo-cta__content">
                        <h2 class="vo-cta__title">Worked with us? Tell us how it went.</h2>
                        <p class="vo-cta__text">Volunteers, partners and NGOs — the honest ones are the most useful.</p>
                    </div>
                    <a class="vo-btn vo-btn--invert vo-btn--lg" href="/">Share your experience<i
                            class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
                </div>
            </div>
        </section>

    </main>

</div>

<style>
    @import url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css");


    .vo-page {
        --vo-accent: #1a56db;
        --vo-accent-dark: #1443ae;
        --vo-accent-soft: #eaf1fd;
        --vo-accent-line: #d6e4fb;
        --vo-star-on: #eab308;

        --vo-ink: #0f172a;
        --vo-body: #4b5563;
        --vo-muted: #6b7280;
        --vo-line: #e5e9f0;
        --vo-surface: #ffffff;
        --vo-surface-2: #f8fafc;
        --vo-navy: #10254e;
        --vo-on-dark: #ffffff;

        --vo-fs-xs: .6875rem;
        --vo-fs-sm: .75rem;
        --vo-fs-md: .875rem;
        --vo-fs-lg: 1rem;
        --vo-fs-xl: clamp(1.0625rem, .9rem + .7vw, 1.25rem);
        --vo-fs-3xl: clamp(1.5rem, 1.05rem + 2vw, 2.25rem);


        --vo-2: .5rem;
        --vo-3: .75rem;
        --vo-4: 1rem;
        --vo-5: 1.25rem;
        --vo-6: 1.5rem;
        --vo-8: 2rem;
        --vo-10: 2.5rem;
        --vo-12: 3rem;

        --vo-section: 3.5rem;
        /* vertical rhythm between bands */

        --vo-r-sm: 8px;
        --vo-r-md: 12px;
        --vo-r-lg: 16px;
        --vo-r-pill: 999px;
        --vo-sh-sm: 0 1px 2px rgba(15, 23, 42, .06);

        --vo-sh-lg: 0 12px 32px rgba(15, 23, 42, .10);

        --vo-w: 75rem;
        --vo-gutter: 1.25rem;

        font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        font-size: var(--vo-fs-md);
        line-height: 1.6;
        color: var(--vo-body);
        background: var(--vo-surface);
    }

    .vo-page *,
    .vo-page *::before,
    .vo-page *::after {
        box-sizing: border-box;
    }

    .vo-page :where(h1, h2) {
        margin: 0;
        line-height: 1.18;
        font-weight: 700;
    }

    .vo-page :where(p, figure, blockquote) {
        margin: 0;
    }

    .vo-page :where(ul, ol) {
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .vo-page :where(img) {
        display: block;
        max-width: 100%;
        height: auto;
    }

    .vo-page :where(a) {
        text-decoration: none;
    }

    .vo-shell {
        width: 100%;
        max-width: var(--vo-w);
        margin-inline: auto;
        padding-inline: var(--vo-gutter);
    }

    .vo-btn {
        display: inline-flex;
        align-items: center;
        gap: var(--vo-2);
        padding: .7rem 1.25rem;
        border-radius: var(--vo-r-sm);
        font-size: var(--vo-fs-md);
        font-weight: 600;
        line-height: 1.2;
        transition: background-color .18s ease, color .18s ease;
    }

    .vo-btn--invert {
        background: var(--vo-surface);
        color: var(--vo-accent);
    }

    .vo-btn--invert:hover {
        background: var(--vo-surface-2);
        color: var(--vo-accent-dark);
    }

    .vo-btn--lg {
        padding: .85rem 1.6rem;
    }

    /* --- Intro (fully centred) ------------------------------------ */
    .vo-intro {
        padding: var(--vo-8) 0 var(--vo-section);
        background: linear-gradient(180deg, var(--vo-surface-2) 0%, var(--vo-surface) 100%);
        text-align: center;
    }

    .vo-crumbs {
        margin-bottom: var(--vo-8);
    }

    .vo-crumbs__list {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: var(--vo-2);
    }

    .vo-crumbs__item {
        display: flex;
        align-items: center;
        gap: var(--vo-2);
        font-size: var(--vo-fs-sm);
        color: var(--vo-muted);
    }

    .vo-crumbs__item::after {
        content: "/";
        color: #94a3b8;
    }

    .vo-crumbs__item--current {
        color: var(--vo-ink);
        font-weight: 600;
    }

    .vo-crumbs__item--current::after {
        content: none;
    }

    .vo-crumbs__link {
        color: inherit;
        display: inline-flex;
        align-items: center;
        gap: var(--vo-2);
    }

    .vo-crumbs__link:hover {
        color: var(--vo-accent);
    }

    .vo-intro__title {
        color: var(--vo-ink);
        font-size: var(--vo-fs-3xl);
        font-weight: 800;
        letter-spacing: -.02em;
        text-wrap: balance;
    }

    .vo-intro__sub {
        margin: var(--vo-4) auto 0;
        max-width: 40rem;
        font-size: var(--vo-fs-lg);
        color: var(--vo-muted);
        text-wrap: balance;
    }

    /* --- The wall -------------------------------------------------- */
    .vo-wall {
        padding: 0 0 var(--vo-section);
    }

    .vo-grid {
        columns: 1;
        column-gap: var(--vo-5);
    }

    .vo-grid:empty {
        display: none;
    }

    .vo-card {
        break-inside: avoid;
        margin-bottom: var(--vo-5);
        padding: var(--vo-6);
        border: 1px solid var(--vo-line);
        border-radius: var(--vo-r-md);
        background: var(--vo-surface);
        box-shadow: var(--vo-sh-sm);
        transition: box-shadow .2s ease, transform .2s ease;
    }

    .vo-card:hover {
        box-shadow: var(--vo-sh-lg);
        transform: translateY(-2px);
    }

    .vo-card__top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--vo-3);
    }

    .vo-card__chip {
        padding: .15rem .6rem;
        border-radius: var(--vo-r-pill);
        background: var(--vo-accent-soft);
        color: var(--vo-accent-dark);
        font-size: var(--vo-fs-xs);
        font-weight: 700;
    }

    .vo-card__mark {
        font-size: 1.5rem;
        color: var(--vo-accent-line);
    }

    .vo-stars {
        margin-top: var(--vo-4);
        display: flex;
        gap: .15rem;
        color: var(--vo-star-on);
        font-size: var(--vo-fs-sm);
    }



    .vo-card__quote {
        margin-top: var(--vo-3);
        font-size: var(--vo-fs-lg);
        line-height: 1.6;
        color: var(--vo-ink);
    }

    .vo-card__by {
        display: flex;
        align-items: center;
        gap: var(--vo-3);
        margin-top: var(--vo-5);
        padding-top: var(--vo-4);
        border-top: 1px solid var(--vo-line);
    }

    .vo-card__avatar {
        width: 2.75rem;
        height: 2.75rem;
        flex: 0 0 auto;
        padding: .3rem;
        border-radius: var(--vo-r-pill);
        background: var(--vo-accent-soft);
        object-fit: contain;
    }

    .vo-card__who {
        display: grid;
        min-width: 0;
    }

    .vo-card__name {
        font-size: var(--vo-fs-md);
        font-weight: 700;
        color: var(--vo-ink);
    }

    .vo-card__role {
        font-size: var(--vo-fs-xs);
        color: var(--vo-muted);
    }

    /* --- CTA band -------------------------------------------------- */
    .vo-cta {
        padding: 0 0 var(--vo-section);
    }

    .vo-cta__panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--vo-6);
        align-items: center;
        padding: var(--vo-8);
        border-radius: var(--vo-r-lg);
        background: linear-gradient(100deg, var(--vo-navy) 0%, var(--vo-accent) 100%);
        color: var(--vo-on-dark);
    }

    .vo-cta__title {
        font-size: var(--vo-fs-xl);
        color: var(--vo-on-dark);
    }

    .vo-cta__text {
        margin-top: var(--vo-2);
        font-size: var(--vo-fs-sm);
        color: rgba(255, 255, 255, .88);
        max-width: 30rem;
    }

    /* --- Breakpoints ----------------------------------------------- */
    @media (min-width: 48em) {
        .vo-page {
            --vo-gutter: 1.5rem;
        }

        .vo-grid {
            columns: 2;
        }

        .vo-cta__panel {
            grid-template-columns: minmax(0, 1fr) auto;
        }
    }

    @media (min-width: 64em) {
        .vo-page {
            --vo-section: 5.5rem;
        }

        .vo-intro {
            padding-top: var(--vo-12);
        }

        .vo-grid {
            columns: 3;
        }

        .vo-cta__panel {
            padding: var(--vo-8) var(--vo-10);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .vo-card:hover {
            transform: none;
        }

        .vo-page * {
            transition: none !important;
        }
    }
</style>
