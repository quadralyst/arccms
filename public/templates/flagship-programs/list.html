<div class="arc-cms-template">
    <main class="pgl-page">
        <section class="pgl-intro">
            <div class="pgl-shell">
                <nav class="pgl-crumbs" aria-label="Breadcrumb">
                    <ol class="pgl-crumbs__list">
                        <li class="pgl-crumbs__item"><a class="pgl-crumbs__link" href="/"><i class="fa-solid fa-house"
                                    aria-hidden="true"></i>Home</a></li>
                        <li class="pgl-crumbs__item pgl-crumbs__item--current" aria-current="page"
                            data-arc-bind="contentType"></li>
                    </ol>
                </nav>

                <h1 class="pgl-intro__title" data-arc-bind="contentType"></h1>
                <p class="pgl-intro__sub" data-arc-bind="description"></p>
            </div>
        </section>
        <section class="pgl-grid-wrap">
            <div class="pgl-shell">
                <div class="pgl-grid" data-arc-loop="items" data-limit="24">
                    <article class="pgl-card" style="--theme-color: {{flagship-programs_color}};">
                        <a class="pgl-card__link" data-arc-bind="url" href="detail.html">
                            <span class="pgl-card__watermark" aria-hidden="true"><i
                                    [class]="flagship-programs_icon"></i></span>
                            <span class="pgl-card__mark">
                                <img data-arc-if="coverImage" src="{{ coverImage }}" alt="{{ title }}"
                                    class="card-cover-img"
                                    style="width: 100%; height: 100%; object-fit: contain; border-radius: 8px;">
                                <i data-arc-if="!coverImage" class="fa-solid fa-star" [class]="flagship-programs_icon"
                                    aria-hidden="true"></i>
                            </span>
                            <p class="pgl-card__status" data-arc-if="flagship-programs_sub-flag"
                                data-arc-bind="flagship-programs_sub-flag"></p>
                            <h2 class="pgl-card__title" data-arc-bind="title"></h2>
                            <p class="pgl-card__text" data-arc-bind="flagship-programs_description_flasghips"></p>
                            <p class="pgl-card__date" data-arc-if="flagship-programs_edition_date">
                                <i class="fa-regular fa-calendar" aria-hidden="true"></i>
                                Next edition <time data-arc-bind="flagship-programs_edition_date"></time>
                            </p>
                            <span class="pgl-card__cta">
                                Read more
                                <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                            </span>
                        </a>
                    </article>
                </div>
            </div>
        </section>

    </main>
</div>

<style>
    @import url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css");

    .pgl-page {
        --pgl-ink: #0f172a;
        --pgl-body: #4b5563;
        --pgl-muted: #6b7280;
        --pgl-line: #e5e9f0;
        --pgl-surface: #ffffff;
        --pgl-surface-2: #f8fafc;
        --themeColor: var(--theme-color);
        --pgl-accent: var(--themeColor);
        --pgl-accent-dark: color-mix(in srgb, var(--pgl-accent), #000 20%);
        --pgl-accent-soft: color-mix(in srgb, var(--pgl-accent) 10%, #fff);
        --pgl-accent-line: color-mix(in srgb, var(--pgl-accent) 20%, #fff);

        --pgl-fs-xs: .6875rem;
        --pgl-fs-sm: .75rem;
        --pgl-fs-md: .875rem;
        --pgl-fs-lg: 1rem;
        --pgl-fs-2xl: clamp(1.25rem, 1rem + 1.1vw, 1.625rem);
        --pgl-fs-3xl: clamp(1.5rem, 1.05rem + 2vw, 2.25rem);

        --pgl-1: .25rem;
        --pgl-2: .5rem;
        --pgl-3: .75rem;
        --pgl-4: 1rem;
        --pgl-5: 1.25rem;
        --pgl-6: 1.5rem;
        --pgl-8: 2rem;
        --pgl-10: 2.5rem;
        --pgl-12: 3rem;
        --pgl-16: 4rem;
        --pgl-section: 3.5rem;
        /* vertical rhythm between bands */

        --pgl-r-sm: 8px;
        --pgl-r-md: 12px;
        --pgl-r-pill: 999px;
        --pgl-sh-sm: 0 1px 2px rgba(15, 23, 42, .06);
        --pgl-sh-lg: 0 12px 32px rgba(15, 23, 42, .10);

        --pgl-w: 75rem;
        --pgl-gutter: 1.25rem;

        font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        font-size: var(--pgl-fs-md);
        line-height: 1.6;
        color: var(--pgl-body);
        background: var(--pgl-surface);
    }

    .pgl-page *,
    .pgl-page *::before,
    .pgl-page *::after {
        box-sizing: border-box;
    }

    .pgl-page :where(h1, h2) {
        margin: 0;
        line-height: 1.18;
        font-weight: 700;
    }

    .pgl-page :where(p) {
        margin: 0;
    }

    .pgl-page :where(ul, ol) {
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .pgl-page :where(img) {
        display: block;
        max-width: 100%;
        height: auto;
    }

    .pgl-page :where(a) {
        text-decoration: none;
    }

    .pgl-shell {
        width: 100%;
        max-width: var(--pgl-w);
        margin-inline: auto;
        padding-inline: var(--pgl-gutter);
    }

    /* --- Intro (fully centred) ----------------------------------- */
    .pgl-intro {
        padding: var(--pgl-8) 0 var(--pgl-section);
        background: linear-gradient(180deg, var(--pgl-surface-2) 0%, var(--pgl-surface) 100%);
        text-align: center;
    }

    .pgl-crumbs {
        margin-bottom: var(--pgl-8);
    }

    .pgl-crumbs__list {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: var(--pgl-2);
    }

    .pgl-crumbs__item {
        display: flex;
        align-items: center;
        gap: var(--pgl-2);
        font-size: var(--pgl-fs-sm);
        color: var(--pgl-muted);
    }

    .pgl-crumbs__item::after {
        content: "/";
        color: #94a3b8;
    }

    .pgl-crumbs__item--current {
        color: var(--pgl-ink);
        font-weight: 600;
    }

    .pgl-crumbs__item--current::after {
        content: none;
    }

    .pgl-crumbs__link {
        color: inherit;
        display: inline-flex;
        align-items: center;
        gap: var(--pgl-2);
    }

    .pgl-crumbs__link:hover {
        color: var(--pgl-accent);
    }

    .pgl-intro__title {
        color: var(--pgl-ink);
        font-size: var(--pgl-fs-3xl);
        font-weight: 800;
        letter-spacing: -.02em;
        text-wrap: balance;
    }

    .pgl-intro__sub {
        margin: var(--pgl-4) auto 0;
        max-width: 40rem;
        font-size: var(--pgl-fs-lg);
        color: var(--pgl-muted);
        text-wrap: balance;
    }

    /* --- Grid ---------------------------------------------------- */
    .pgl-grid-wrap {
        padding: 0 0 var(--pgl-section);
    }

    .pgl-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
        gap: var(--pgl-5);
    }

    .pgl-grid:empty {
        display: none;
    }

    .pgl-card {
        --themeColor: var(--theme-color);
        --pgl-accent: var(--themeColor);
        --pgl-accent-dark: color-mix(in srgb, var(--pgl-accent), #000 20%);
        --pgl-accent-soft: color-mix(in srgb, var(--pgl-accent) 10%, #fff);
        --pgl-accent-line: color-mix(in srgb, var(--pgl-accent) 20%, #fff);
        position: relative;
        border: 1px solid var(--pgl-accent-line);
        border-radius: var(--pgl-r-md);
        background: var(--pgl-accent-soft);
        overflow: hidden;
        box-shadow: var(--pgl-sh-sm);
        transition: box-shadow .2s ease, transform .2s ease;
    }



    .pgl-card:hover {
        box-shadow: var(--pgl-sh-lg);
        transform: translateY(-2px);
    }

    .pgl-card__link {
        position: relative;
        color: inherit;
        display: flex;
        flex-direction: column;
        gap: var(--pgl-3);
        height: 100%;
        padding: var(--pgl-6);
    }

    .pgl-card__watermark {
        display: block;
        position: absolute;
        top: -.75rem;
        right: -.5rem;
        font-size: 6.5rem;
        color: var(--pgl-accent);
        opacity: .18;
        pointer-events: none;
        user-select: none;
    }

    .pgl-card__mark {
        display: grid;
        place-items: center;
        width: 2.6rem;
        height: 2.6rem;
        border-radius: var(--pgl-r-sm);
        background: var(--pgl-surface);
        color: var(--pgl-accent);
        font-size: 1.15rem;
        box-shadow: var(--pgl-sh-sm);
    }

    .pgl-card__status {
        align-self: flex-start;
        padding: .15rem .6rem;
        border-radius: var(--pgl-r-pill);
        background: var(--pgl-accent);
        color: #ffffff;
        font-size: var(--pgl-fs-xs);
        font-weight: 600;
    }

    .pgl-card__title {
        color: var(--pgl-accent);
        font-size: var(--pgl-fs-lg);
        font-weight: 800;
    }

    .pgl-card__text {
        font-size: var(--pgl-fs-sm);
        color: var(--pgl-body);
    }

    .pgl-card__date {
        display: flex;
        align-items: center;
        gap: var(--pgl-2);
        font-size: var(--pgl-fs-xs);
        color: var(--pgl-muted);
    }

    .pgl-card__cta {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        gap: var(--pgl-2);
        margin-top: auto;
        padding: .7rem var(--pgl-4);
        border-radius: var(--pgl-r-sm);
        background: var(--pgl-accent);
        color: #ffffff;
        font-size: var(--pgl-fs-md);
        font-weight: 600;
        transition: background-color .18s ease;
    }

    .pgl-card__link:hover .pgl-card__cta {
        background: var(--pgl-accent-dark);
    }

    /* --- Breakpoints --------------------------------------------- */
    @media (min-width: 48em) {
        .pgl-page {
            --pgl-gutter: 1.5rem;
        }
    }

    @media (min-width: 64em) {
        .pgl-page {
            --pgl-section: 5.5rem;
        }

        .pgl-intro {
            padding-top: var(--pgl-12);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .pgl-card:hover {
            transform: none;
        }

        .pgl-page * {
            transition: none !important;
        }
    }
</style>
