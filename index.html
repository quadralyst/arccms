<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <!-- Until the app starts: the app's name (src/custom/brand.ts, written in by vite.config.ts), else this -->
  <title>Loading</title>
  <base href="/" />
  <!-- No robots tag here: a page whose first HTML says noindex may never be rendered by a
       search engine. The app adds it as it shows each page that is not public
       (src/app/core/site/search-engines.ts), and Hosting sends X-Robots-Tag: noindex on
       sign-in, member and admin addresses (firebase.json). -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <!-- Bootstrap, the icon fonts and Roboto, served with the app (src/vendor-styles.css):
       first, so core's styles below override Bootstrap as they did when it came from a CDN. -->
  <link rel="stylesheet" href="/src/vendor-styles.css" />
  <link rel="stylesheet" href="/src/styles.css" />
  <!-- The app's own styles (src/custom/styles.css, docs/app/custom-space.html): last, so they win. -->
  <link rel="stylesheet" href="/src/custom/styles.css" />

</head>

<body>
  <arc-root>
    <div class="app-loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading...</div>
    </div>
  </arc-root>

  <script type="module" src="/src/main.ts"></script>
  <!-- Bootstrap's script (window.bootstrap) is added here by scripts/vite-vendor-scripts.ts, served with the app. -->
</body>

</html>
