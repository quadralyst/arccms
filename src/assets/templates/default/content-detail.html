<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Detail - Arc CMS</title>
    <meta name="description" content="Content detail page">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3c76f5;
            --secondary: #64748b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .article-header {
            background: linear-gradient(135deg, #1d47a3 0%, #3c76f5 100%);
            color: white;
            padding: 4rem 0;
        }

        .article-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .article-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 0.875rem;
            opacity: 0.9;
        }

        .article-meta i {
            margin-right: 0.25rem;
        }

        .article-content {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            margin-top: -2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .article-cover {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .article-body {
            font-size: 1.125rem;
            line-height: 1.8;
        }

        .article-body h2,
        .article-body h3 {
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        .article-body p {
            margin-bottom: 1.5rem;
        }

        .article-tags {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }

        .tag {
            display: inline-block;
            background: #e2e8f0;
            color: var(--text-muted);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            text-decoration: none;
        }

        .tag:hover {
            background: var(--primary);
            color: white;
        }
    </style>
</head>

<body>
    <header class="article-header">
        <div class="container">
            <span class="badge bg-white text-primary mb-3" data-arc-bind="category">Category</span>
            <h1 data-arc-bind="title">Article Title</h1>
            <div class="article-meta">
                <span><i class="far fa-calendar"></i> <span data-arc-bind="date">Date</span></span>
                <span><i class="far fa-clock"></i> <span data-arc-bind="readingTime">Reading time</span></span>
                <span><i class="far fa-eye"></i> <span data-arc-bind="views">Views</span></span>
            </div>
        </div>
    </header>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="article-content">
                        <img class="article-cover" data-arc-bind="coverImage" src="" alt="Cover Image">
                        <div class="article-body" data-arc-bind="content">
                            <!-- Content will be injected here -->
                        </div>
                        <div class="article-tags">
                            <h4>Tags</h4>
                            <div data-arc-loop="tags">
                                <span class="tag"><span data-arc-bind="tag">Tag</span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
