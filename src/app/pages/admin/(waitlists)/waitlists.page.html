<!-- Forms admin page -->
<div class="page-container">
    <arc-page-header [title]="'admin.forms.title' | transloco" [subtitle]="'admin.forms.subtitle' | transloco">
        <button class="btn btn-primary" (click)="openAddDrawer()">
            <i class="fas fa-plus" aria-hidden="true"></i> {{ 'admin.forms.add' | transloco }}
        </button>
    </arc-page-header>

    <!-- Email not set up -->
    @if (emailConfigService.shouldShowBanner()) {
    <div class="alert alert-warning d-flex align-items-center justify-content-between mb-4" role="alert">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
            <span><strong>{{ 'admin.forms.email_off_title' | transloco }}</strong> {{ 'admin.forms.email_off_text' | transloco }}</span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <a routerLink="/admin/settings/email" class="btn btn-warning btn-sm">
                <i class="bi bi-gear me-1" aria-hidden="true"></i> {{ 'admin.forms.email_setup' | transloco }}
            </a>
            <button type="button" class="btn-close" [attr.aria-label]="'common.actions.close' | transloco"
                (click)="emailConfigService.dismissBanner()"></button>
        </div>
    </div>
    }

    <app-global-table [data]="waitlists()" [columns]="tableColumns" [loading]="loading()"
        [error]="loadError()" (retry)="loadWaitlists()"
        emptyTitle="admin.forms.empty_title" emptyDescription="admin.forms.empty_text"
        emptyActionLabel="admin.forms.empty_action" (emptyActionClick)="openAddDrawer()">
    </app-global-table>

</div>

<!-- Shared Add/Edit Drawer -->
<arc-waitlist-edit-drawer
    [isOpen]="isDrawerOpen()"
    [action]="currentAction()"
    [waitlist]="currentWaitlist()"
    (saved)="onDrawerSaved($event)"
    (closed)="closeDrawer()">
</arc-waitlist-edit-drawer>
