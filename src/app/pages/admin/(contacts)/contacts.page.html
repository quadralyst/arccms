<mat-drawer-container class="contacts-drawer-container" hasBackdrop="true">
    <mat-drawer #drawer mode="over" position="end" class="drawer" style="width: 500px;">
        @if (currentAction()) {
        <arc-contact-drawer [mode]="currentAction()" [lists]="lists()" [contact]="currentContact()"
            (saved)="closeDrawer()" (close)="closeDrawer()">
        </arc-contact-drawer>
        }
    </mat-drawer>

    <mat-drawer-content>
        <div class="page-container">
            <!-- Header -->
            <div class="page-header">
                <div class="header-content">
                    <h1>Contacts</h1>
                    <p class="subtitle">The unified audience. Contacts sync automatically from signups, waitlists and customers.</p>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <button mat-stroked-button [disabled]="busy()" (click)="runBackfill()">
                        <mat-icon>sync</mat-icon> Backfill
                    </button>
                    <button mat-stroked-button (click)="openImport()">
                        <mat-icon>upload_file</mat-icon> Import CSV
                    </button>
                    <button mat-flat-button color="primary" (click)="openAdd()">
                        <mat-icon>person_add</mat-icon> Add contact
                    </button>
                </div>
            </div>

            <!-- Search -->
            <mat-form-field appearance="outline" style="width: 320px;">
                <mat-label>Search contacts</mat-label>
                <input matInput [ngModel]="search()" (ngModelChange)="onSearch($event)" placeholder="email or name" />
            </mat-form-field>

            <!-- Table -->
            <app-global-table [data]="paged()" [columns]="columns" [loading]="loading()"
                [pageIndex]="currentPage()" [pageSize]="pageSize()"
                emptyIcon="fas fa-address-book" emptyTitle="No contacts found"
                emptyDescription="Add a contact, import a CSV, or run a backfill to get started."
                emptyActionLabel="Add contact" emptyActionIcon="fas fa-user-plus"
                (emptyActionClick)="openAdd()">
            </app-global-table>

            <!-- Pagination -->
            @if (total()) {
            <div class="pagination-footer d-flex justify-content-between align-items-center">
                <div class="record-count text-muted">
                    Showing {{ getStartRecord() }} to {{ getEndRecord() }} of <strong>{{ total() }}</strong> contacts
                </div>
                <mat-paginator [length]="total()" [pageSize]="pageSize()" [pageIndex]="currentPage()"
                    [pageSizeOptions]="[5, 10, 25, 50]" [showFirstLastButtons]="true" (page)="onPageChange($event)">
                </mat-paginator>
            </div>
            }
        </div>
    </mat-drawer-content>
</mat-drawer-container>
