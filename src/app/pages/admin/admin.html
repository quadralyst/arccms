<div class="arc-admin">
    <mat-drawer-container class="arc-main-page" autosize hasBackdrop="false">
        <mat-drawer class="arc-side-panel user_panel" [style.width.px]="!isExpanded && drawerMode !== 'over' ? 65 : 230"
            #drawer position="start" [mode]="drawerMode" [opened]="drawerMode === 'over' ? false : true" cdkScrollable>
            <arc-side-navbar (toggleMenu)="toggleMenu()" [isExpanded]="drawerMode === 'over' ? true : isExpanded"
                [drawerMode]="drawerMode"></arc-side-navbar>
        </mat-drawer>
        <mat-drawer-content autosize>
            <!-- <div [hidden]="drawerMode === 'side'" class="btn arrow">
          <button class="btn btn-link text-decoration-none mob_menu" (click)="drawer.toggle()">Menu</button>
        </div> -->

            <!-- Always-visible top bar. On desktop (side mode) the sidebar already
                 supplies branding/nav, so only the notification bell shows; on
                 mobile (over mode) the hamburger + app name appear as well. -->
            <mat-toolbar class="mob_menu d-flex align-items-center">
                <div class="d-flex align-items-center" [ngClass]="drawerMode === 'side' ? 'd-none' : ''">
                    <div class="btn d-flex border-0" (click)="drawer.toggle()">
                        <mat-icon class="">menu</mat-icon>
                    </div>
                    <span>{{ constantVariables.APPLICATION_NAME }}</span>
                </div>
                <arc-notification-bell class="ms-auto"></arc-notification-bell>
            </mat-toolbar>
            <router-outlet></router-outlet>
            <!-- <arc-footer></arc-footer> -->
        </mat-drawer-content>
    </mat-drawer-container>
</div>
