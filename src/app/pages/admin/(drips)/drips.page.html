<mat-drawer-container class="drips-drawer-container" hasBackdrop="true">
    <mat-drawer #drawer mode="over" position="end" class="drawer" style="width: 600px;">
        @if (currentAction()) {
        <arc-drip-drawer [mode]="currentAction() || 'add'" [campaign]="currentCampaign()"
            [lists]="lists()" [templates]="templates()"
            (saved)="closeDrawer()" (close)="closeDrawer()">
        </arc-drip-drawer>
        }
    </mat-drawer>

    <mat-drawer-content>
        <div class="page-container">
            <arc-page-header [title]="'admin.drips.title' | transloco"
                [subtitle]="'admin.drips.subtitle' | transloco">
                <button mat-flat-button color="primary" (click)="openAdd()">
                    <mat-icon aria-hidden="true">add</mat-icon> {{ 'admin.drips.new' | transloco }}
                </button>
            </arc-page-header>

            <app-global-table [data]="campaigns()" [columns]="columns" [loading]="loading()"
                [error]="loadError()" (retry)="load()"
                emptyIcon="fas fa-droplet" emptyTitle="admin.drips.empty_title"
                emptyDescription="admin.drips.empty_text"
                emptyActionLabel="admin.drips.new" emptyActionIcon="fas fa-plus"
                (emptyActionClick)="openAdd()">
            </app-global-table>
        </div>
    </mat-drawer-content>
</mat-drawer-container>
