<mat-drawer-container class="drips-drawer-container" hasBackdrop="true">
    <mat-drawer #drawer mode="over" position="end" class="drawer" style="width: 600px;">
        @if (currentAction()) {
        <arc-drip-drawer [mode]="currentAction()" [campaign]="currentCampaign()"
            [lists]="lists()" [templates]="templates()"
            (saved)="closeDrawer()" (close)="closeDrawer()">
        </arc-drip-drawer>
        }
    </mat-drawer>

    <mat-drawer-content>
        <div class="page-container">
            <div class="page-header">
                <div class="header-content">
                    <h1>Drip Campaigns</h1>
                    <p class="subtitle">Linear sequences per list. Joining a list enrolls a contact; leaving or unsubscribing exits them.</p>
                </div>
                <button mat-flat-button color="primary" (click)="openAdd()">
                    <mat-icon>add</mat-icon> New campaign
                </button>
            </div>

            <app-global-table [data]="campaigns()" [columns]="columns" [loading]="loading()"
                emptyIcon="fas fa-droplet" emptyTitle="No campaigns yet"
                emptyDescription="Create a drip campaign to send a timed sequence of emails when contacts join a list."
                emptyActionLabel="New campaign" emptyActionIcon="fas fa-plus"
                (emptyActionClick)="openAdd()">
            </app-global-table>
        </div>
    </mat-drawer-content>
</mat-drawer-container>
