<h2 mat-dialog-title class="text-center">{{ title }}</h2>
<mat-dialog-content [innerHTML]="_DIALOG_DATA.dialogMessage"></mat-dialog-content>
<mat-dialog-actions>
    <!-- Focus starts on Cancel: Enter pressed by reflex must never delete anything. -->
    <button type="button" mat-button mat-dialog-close cdkFocusInitial class="cancel-btn">{{ cancelText }}</button>
    <button type="button" class="btn confirm-btn" [ngClass]="_DIALOG_DATA.panelType === 'warn' ? 'btn-danger' : 'btn-primary'" mat-button
        (click)="confirm()">
        {{ _DIALOG_DATA.btnText }}
    </button>
</mat-dialog-actions>
