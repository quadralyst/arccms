<!-- Floating menus -->
@if(editor){
<div class="no-select">
    <tiptap-editor #contentArea [editor]="editor" id="editor-with-bubble-menu"></tiptap-editor>
    <tiptap-bubble-menu [editor]="editor">
        <arc-selection-menu [editor]="editor" (replaceImage)="openMediaManagerModal()" />
    </tiptap-bubble-menu>
</div>
}
