<!-- Floating menus -->
@if(editor){
<div class="no-select">
    <tiptap-editor #contentArea [editor]="editor" id="editor-with-bubble-menu"></tiptap-editor>
    <tiptap-bubble-menu [editor]="editor">
        <div class="border rounded text-gray-300 divide-x p-1 bubble_menu" data-test-id="bubble-menu">

            <!-- Heading Buttons -->
            <button [matTooltip]="'common.editor_toolbar.text_style' | transloco" [attr.aria-label]="'common.editor_toolbar.text_style' | transloco" matTooltipPosition="below"
                (click)="isOpenFormateOverlay = !isOpenFormateOverlay"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles" type="button" cdkOverlayOrigin
                #triggerFormate="cdkOverlayOrigin">
                Aa <i class="bi bi-chevron-down" aria-hidden="true"></i>
            </button>
            <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="triggerFormate"
                cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
                [cdkConnectedOverlayHasBackdrop]="true" [cdkConnectedOverlayOpen]="isOpenFormateOverlay"
                (detach)="isOpenFormateOverlay = false" (backdropClick)="isOpenFormateOverlay = false">
                <ul class="heading-list">
                    <li>
                        <button type="button"
                            class="px-1 hover:text-white bg-light border-0 w-100 text-start fs-4 text_styles_dropdown"
                            (click)="editor.chain().focus().toggleHeading({ level: 1 }).run(); isOpenFormateOverlay = false"
                            [ngClass]="{ 'formate_custome_selected': editor.isActive('heading', { level: 1 }) }">
                            {{ 'common.editor_toolbar.heading_1' | transloco }}
                        </button>
                    </li>
                    <li>
                        <button type="button"
                            class="px-1 hover:text-white bg-light border-0 w-100 text-start fs-5 text_styles_dropdown"
                            (click)="editor.chain().focus().toggleHeading({ level: 2 }).run(); isOpenFormateOverlay = false"
                            [ngClass]="{ 'formate_custome_selected': editor.isActive('heading', { level: 2 }) }">
                            {{ 'common.editor_toolbar.heading_2' | transloco }}
                        </button>
                    </li>
                    <li>
                        <button type="button"
                            class="px-1 hover:text-white bg-light border-0 w-100 text-start fs-6 text_styles_dropdown"
                            (click)="editor.chain().focus().toggleHeading({ level: 3 }).run(); isOpenFormateOverlay = false"
                            [ngClass]="{ 'formate_custome_selected': editor.isActive('heading', { level: 3 }) }">
                            {{ 'common.editor_toolbar.heading_3' | transloco }}
                        </button>
                    </li>
                </ul>
            </ng-template>

            <!-- Text Style Buttons -->
            <button type="button" [matTooltip]="'common.editor_toolbar.bold' | transloco" [attr.aria-label]="'common.editor_toolbar.bold' | transloco" matTooltipPosition="below"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles"
                (click)="editor.chain().focus().toggleBold().run()"
                [ngClass]="{ 'fixed_custome_selected': editor.isActive('bold') }">
                <i class="bi bi-type-bold" aria-hidden="true"></i>
            </button>
            <button type="button" [matTooltip]="'common.editor_toolbar.italic' | transloco" [attr.aria-label]="'common.editor_toolbar.italic' | transloco" matTooltipPosition="below"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles"
                (click)="editor.chain().focus().toggleItalic().run()"
                [ngClass]="{ 'fixed_custome_selected': editor.isActive('italic') }">
                <i class="bi bi-type-italic" aria-hidden="true"></i>
            </button>
            <button type="button" [matTooltip]="'common.editor_toolbar.strike' | transloco" [attr.aria-label]="'common.editor_toolbar.strike' | transloco" matTooltipPosition="below"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles"
                (click)="editor.chain().focus().toggleStrike().run()"
                [ngClass]="{ 'fixed_custome_selected': editor.isActive('strike') }">
                <i class="bi bi-type-strikethrough" aria-hidden="true"></i>
            </button>
            <button type="button" [matTooltip]="'common.editor_toolbar.underline' | transloco" [attr.aria-label]="'common.editor_toolbar.underline' | transloco" matTooltipPosition="below"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles"
                (click)="editor.chain().focus().toggleUnderline().run()"
                [ngClass]="{ 'fixed_custome_selected': editor.isActive('underline') }">
                <i class="bi bi-type-underline" aria-hidden="true"></i>
            </button>
            <button type="button" [matTooltip]="'common.editor_toolbar.subscript' | transloco" [attr.aria-label]="'common.editor_toolbar.subscript' | transloco" matTooltipPosition="below"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles"
                (click)="editor.chain().focus().toggleSubscript().run()"
                [ngClass]="{ 'fixed_custome_selected': editor.isActive('subscript') }">
                <i class="bi bi-subscript" aria-hidden="true"></i>
            </button>

            <!-- Blockquote Buttons -->
            <button type="button" [matTooltip]="'common.editor_toolbar.quote' | transloco" [attr.aria-label]="'common.editor_toolbar.quote' | transloco" matTooltipPosition="below"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles"
                (click)="editor.chain().focus().toggleBlockquote().run()"
                [ngClass]="{ 'fixed_custome_selected': editor.isActive('blockquote') }">
                <i class="bi bi-quote" aria-hidden="true"></i>
            </button>

            <!-- Structured blocks (D-D10) and tables -->
            <button [matTooltip]="'common.editor_toolbar.insert_block' | transloco" [attr.aria-label]="'common.editor_toolbar.insert_block' | transloco" matTooltipPosition="below"
                (click)="isOpenBlocksOverlay = !isOpenBlocksOverlay"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles" type="button" cdkOverlayOrigin
                #triggerBlocks="cdkOverlayOrigin" data-testid="blocks-menu">
                <i class="bi bi-grid-1x2" aria-hidden="true"></i> <i class="bi bi-chevron-down" aria-hidden="true"></i>
            </button>
            <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="triggerBlocks"
                cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
                [cdkConnectedOverlayHasBackdrop]="true" [cdkConnectedOverlayOpen]="isOpenBlocksOverlay"
                (detach)="isOpenBlocksOverlay = false" (backdropClick)="isOpenBlocksOverlay = false">
                <ul class="heading-list blocks-list">
                    @for (block of arcBlocks; track block.kind) {
                    <li>
                        <button type="button"
                            class="px-1 hover:text-white bg-light border-0 w-100 text-start text_styles_dropdown"
                            (click)="insertArcBlock(block.kind)" [attr.data-testid]="'insert-block-' + block.kind"
                            [matTooltip]="('common.editor_toolbar.block_' + block.kind + '_hint') | transloco" matTooltipPosition="right">
                            <i [class]="block.icon" aria-hidden="true"></i> &nbsp; {{ ('common.slash_commands.block_' + block.kind) | transloco }}
                        </button>
                    </li>
                    }
                    <li>
                        <button type="button"
                            class="px-1 hover:text-white bg-light border-0 w-100 text-start text_styles_dropdown"
                            (click)="insertTable()" data-testid="insert-table">
                            <i class="bi bi-table" aria-hidden="true"></i> &nbsp; {{ 'common.slash_commands.table' | transloco }}
                        </button>
                    </li>
                </ul>
            </ng-template>

            <!-- Set List type -->
            <button [matTooltip]="'common.editor_toolbar.list_type' | transloco" [attr.aria-label]="'common.editor_toolbar.list_type' | transloco" matTooltipPosition="below"
                (click)="isOpenListTypeOverlay = !isOpenListTypeOverlay"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles" type="button" cdkOverlayOrigin
                #triggerListType="cdkOverlayOrigin">
                <i class="bi bi-card-checklist" aria-hidden="true"></i> <i class="bi bi-chevron-down" aria-hidden="true"></i>
            </button>
            <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="triggerListType"
                cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
                [cdkConnectedOverlayHasBackdrop]="true" [cdkConnectedOverlayOpen]="isOpenListTypeOverlay"
                (detach)="isOpenListTypeOverlay = false" (backdropClick)="isOpenListTypeOverlay = false">
                <ul class="heading-list">
                    <li>
                        <button type="button"
                            class="px-1 hover:text-white bg-light border-0 w-100 text-start text_styles_dropdown"
                            (click)="editor.chain().focus().toggleBulletList().run(); isOpenListTypeOverlay = false"
                            [ngClass]="{ 'formate_custome_selected': editor.isActive('bulletList') }">
                            <i class="bi bi-list-ul" aria-hidden="true"></i> &nbsp; {{ 'common.editor_toolbar.bullet_list' | transloco }}
                        </button>
                    </li>
                    <li>
                        <button type="button"
                            class="px-1 hover:text-white bg-light border-0 w-100 text-start text_styles_dropdown"
                            (click)="editor.chain().focus().toggleTaskList().run(); isOpenListTypeOverlay = false"
                            [ngClass]="{ 'formate_custome_selected': editor.isActive('taskList') }">
                            <i class="bi bi-ui-checks" aria-hidden="true"></i> &nbsp; {{ 'common.editor_toolbar.checklist' | transloco }}
                        </button>
                    </li>
                    <li>
                        <button type="button"
                            class="px-1 hover:text-white bg-light border-0 w-100 text-start text_styles_dropdown"
                            (click)="editor.chain().focus().toggleOrderedList().run(); isOpenListTypeOverlay = false"
                            [ngClass]="{ 'formate_custome_selected': editor.isActive('itemList') }">
                            <i class="bi bi-list-ol" aria-hidden="true"></i> &nbsp; {{ 'common.editor_toolbar.numbered_list' | transloco }}
                        </button>
                    </li>
                </ul>
            </ng-template>

            <!-- Alignment -->
            <button [matTooltip]="'common.editor_toolbar.alignment' | transloco" [attr.aria-label]="'common.editor_toolbar.alignment' | transloco" matTooltipPosition="below"
                (click)="isOpenAlignOverlay = !isOpenAlignOverlay"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles" type="button" cdkOverlayOrigin
                #triggerAlign="cdkOverlayOrigin">
                <i class="bi bi-text-left" aria-hidden="true"></i> <i class="bi bi-chevron-down" aria-hidden="true"></i>
            </button>
            <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="triggerAlign"
                cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
                [cdkConnectedOverlayHasBackdrop]="true" [cdkConnectedOverlayOpen]="isOpenAlignOverlay"
                (detach)="isOpenAlignOverlay = false" (backdropClick)="isOpenAlignOverlay = false">
                <ul class="heading-list">
                    <li>
                        <button type="button"
                            class="px-1 hover:text-white bg-light border-0 w-100 text-start text_styles_dropdown"
                            (click)="editor.chain().focus().setTextAlign('left').run(); isOpenAlignOverlay = false"
                            [ngClass]="{ 'formate_custome_selected': editor.isActive({ textAlign: 'left' }) }">
                            <i class="bi bi-text-left" aria-hidden="true"></i> &nbsp; {{ 'common.editor_toolbar.left' | transloco }}
                        </button>
                    </li>
                    <li>
                        <button type="button"
                            class="px-1 hover:text-white bg-light border-0 w-100 text-start text_styles_dropdown"
                            (click)="editor.chain().focus().setTextAlign('center').run(); isOpenAlignOverlay = false"
                            [ngClass]="{ 'formate_custome_selected': editor.isActive({ textAlign: 'center' }) }">
                            <i class="bi bi-text-center" aria-hidden="true"></i> &nbsp; {{ 'common.editor_toolbar.center' | transloco }}
                        </button>
                    </li>
                    <li>
                        <button type="button"
                            class="px-1 hover:text-white bg-light border-0 w-100 text-start text_styles_dropdown"
                            (click)="editor.chain().focus().setTextAlign('right').run(); isOpenAlignOverlay = false"
                            [ngClass]="{ 'formate_custome_selected': editor.isActive({ textAlign: 'right' }) }">
                            <i class="bi bi-text-right" aria-hidden="true"></i> &nbsp; {{ 'common.editor_toolbar.right' | transloco }}
                        </button>
                    </li>
                    <li>
                        <button type="button"
                            class="px-1 hover:text-white bg-light border-0 w-100 text-start text_styles_dropdown"
                            (click)="editor.chain().focus().setTextAlign('justify').run(); isOpenAlignOverlay = false"
                            [ngClass]="{ 'formate_custome_selected': editor.isActive({ textAlign: 'justify' }) }">
                            <i class="bi bi-justify" aria-hidden="true"></i> &nbsp; {{ 'common.editor_toolbar.justify' | transloco }}
                        </button>
                    </li>
                </ul>
            </ng-template>

            <!-- Set link -->
            <button type="button" [matTooltip]="'common.editor_toolbar.link' | transloco" [attr.aria-label]="'common.editor_toolbar.link' | transloco" matTooltipPosition="below"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles" (click)="openToAddUrlModal('link')">
                <i class="bi bi-link-45deg" aria-hidden="true"></i>
            </button>

            <!-- Set or Unset code -->
            <button type="button" [matTooltip]="'common.editor_toolbar.code' | transloco" [attr.aria-label]="'common.editor_toolbar.code' | transloco" matTooltipPosition="below"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles"
                (click)="editor.chain().focus().setCode().run()" [disabled]="editor.isActive('code')">
                <i class="bi bi-code" aria-hidden="true"></i>
            </button>
            <button type="button" [matTooltip]="'common.editor_toolbar.remove_code' | transloco" [attr.aria-label]="'common.editor_toolbar.remove_code' | transloco" matTooltipPosition="below"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles"
                (click)="editor.chain().focus().unsetCode().run()" [disabled]="!editor.isActive('code')">
                <i class="bi bi-code-slash" aria-hidden="true"></i>
            </button>

            <!-- Undo/Redo -->
            <button type="button" [matTooltip]="'common.editor_toolbar.undo' | transloco" [attr.aria-label]="'common.editor_toolbar.undo' | transloco" matTooltipPosition="below"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles"
                (click)="editor.chain().focus().undo().run()" [disabled]="!editor.can().undo()">
                <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
            </button>
            <button type="button" [matTooltip]="'common.editor_toolbar.redo' | transloco" [attr.aria-label]="'common.editor_toolbar.redo' | transloco" matTooltipPosition="below"
                class="px-1 hover:text-white border-0 fs-6 menuButtonStyles"
                (click)="editor.chain().focus().redo().run()" [disabled]="!editor.can().redo()">
                <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
            </button>

        </div>
    </tiptap-bubble-menu>
</div>
}
