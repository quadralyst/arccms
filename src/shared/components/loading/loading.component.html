@if(isLoading) {
<div id="pause" class="card">
    <div class="card-body d-flex align-items-center justify-content-center">
        <span class="loader-css p-4">
            <span class="spinner-border" role="status"></span>&nbsp;&nbsp;
            <span class="">Please wait...</span>
        </span>
    </div>
</div>
}
